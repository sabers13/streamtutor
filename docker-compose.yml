services:
  streamtutor-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamtutor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite databases and exported CSV flashcards to the host machine
      - ./backend/data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ANALYZER_PROVIDER=deterministic
